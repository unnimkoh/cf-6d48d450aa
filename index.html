<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>채널 바닥 종목</title>
<style>
:root { color-scheme: light; --fg: #141414; --bg: #f7f7f5; --muted: #6e6e6a; --line: #141414; --soft: #dcdcd8; --grey: #c8c8c6; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --fg: #ededeb; --bg: #161616; --muted: #9b9b97; --line: #ededeb; --soft: #3a3a38; --grey: #4a4a48; --bad: #e06666; } }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
.wrap { max-width: 380px; margin: 0 auto; padding: 18vh max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.meta { border-top: 1px solid var(--line); padding-top: 4px; font-size: 12px; color: var(--muted); }
h1 { margin: 0; font-weight: 800; letter-spacing: -0.03em; font-size: 2.6rem; line-height: 1; }
form { display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
input[type=text], input[type=password] { font: inherit; font-size: 16px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); border-radius: 0; }
input:focus-visible { outline: none; border-bottom-width: 2px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.keep { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
button { font: inherit; font-weight: 800; padding: 8px 18px; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; }
button:disabled { opacity: .5; cursor: progress; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.msg { min-height: 1.2em; font-size: 12px; color: var(--bad); margin: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
</style>
</head>

<main class="wrap">

const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const bu = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
const KEY = 'channel-floor-kek';
async function kekBits(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: P.iter }, base, 256);
}
async function tryUnwrap(bits, acc) {
  const k = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(acc.iv) }, k, ub(acc.key));
}
async function openWith(ckeyRaw) {
  const ck = await crypto.subtle.importKey('raw', ckeyRaw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, ck, ub(P.data));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
async function fromStore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!saved) return false;
  for (const acc of P.accounts) {
    if (acc.salt !== saved.salt) continue;
    try { await openWith(await tryUnwrap(ub(saved.bits), acc)); return true; } catch (e) {}
  }
  try { localStorage.removeItem(KEY); } catch (e) {}
  return false;
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  const pw = document.getElementById('upw').value;
  btn.disabled = true; msg.textContent = '';
  try {
    for (const acc of P.accounts) {
      const bits = await kekBits(pw, ub(acc.salt));
      try {
        const ck = await tryUnwrap(bits, acc);
        if (document.getElementById('keep').checked) { try { localStorage.setItem(KEY, JSON.stringify({ salt: acc.salt, bits: bu(bits) })); } catch (e) {} }
        await openWith(ck);
        return;
      } catch (e) { /* 다른 계정으로 */ }
    }
    msg.textContent = '비밀번호가 맞지 않습니다.';
  } catch (e) {
    msg.textContent = '이 브라우저에서는 열 수 없습니다. 최신 크롬이나 사파리로 열어 주세요.';
  }
  btn.disabled = false;
});
fromStore();
